<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <link rel="stylesheet" href="jsestilo.css" />
  <body>
    <h1 id="titulo">Christian Aldair</h1>

    <button id="btnCambiar">Cambiar texto</button>

    <ul id="lista"></ul>
    <button id="btnAgregar">Agregar elemento</button>
    <button id="btn">Haz clic aquí</button>
    <br /><br />
    <h1>Presiona una tecla</h1>
    <p id="resultado"></p>

    <form id="formulario">
      <input id="nombre" type="text" />
      <button type="submit">Guardar</button>
    </form>
    <p id="datoGuardado"></p>

    <script>
      const titulo = document.getElementById("titulo");

      titulo.style.color = "black";
      titulo.style.fontSize = "30px";

      const botonCambiar = document.getElementById("btnCambiar");

      botonCambiar.addEventListener("click", function () {
        titulo.textContent = "Cordero Zuñiga";
        titulo.style.color = "blue";
        titulo.style.fontSize = "40px";
      });

      const lista = document.getElementById("lista");
      const botonAgregar = document.getElementById("btnAgregar");

      botonAgregar.addEventListener("click", function () {
        const li = document.createElement("li");

        li.textContent = "Nuevo elemento";

        lista.appendChild(li);
      });

      const botonMensaje = document.getElementById("btn");

      botonMensaje.addEventListener("click", function () {
        console.log("Se hizo clic");
        alert("¡Bienvenido!");
      });
      const resultado = document.getElementById("resultado");
      document.addEventListener("keydown", (evento) => {
        console.log("Tecla:", evento.key); // se ve en consola
        alert("Tecla presionada!");
        resultado.textContent = "Presionaste: " + evento.key; // se ve en la página
      });

      const formulario = document.getElementById("formulario");
      formulario.addEventListener("submit", (evento) => {
        evento.preventDefault(); // evita que la página se recargue
        const nombre = document.getElementById("nombre").value; // obtiene el valor del input
        alert("Dato guardado!");
        console.log("Nombre:", nombre); // muestra el dato en consola
        document.getElementById("datoGuardado").textContent =
          "Dato guardado: " + nombre;
      });
    </script>

        <a href="javascript.html">JavaScript</a>
      </nav>
    </footer>   
  </body>
</html>
